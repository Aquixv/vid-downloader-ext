<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: system-ui, sans-serif; width: 300px; padding: 15px; margin: 0; background: #1e1e1e; color: #fff; }
        h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .section { margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button { width: 100%; padding: 8px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .toggle-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        #status { font-size: 12px; color: #4ade80; margin-top: 5px; display: none; }
    </style>
</head>
<body>
    <div class="section">
        <h3>Quick Download</h3>
        <input type="text" id="manual-url" placeholder="Paste video/post URL here...">
        <button id="download-btn">Download</button>
        <div id="status">Request sent to backend...</div>
    </div>

    <div class="section">
        <h3>Show Floating Button On:</h3>
        <div class="toggle-row">
            <label for="toggle-youtube">YouTube</label>
            <input type="checkbox" id="toggle-youtube" checked>
        </div>
        <div class="toggle-row">
            <label for="toggle-tiktok">TikTok</label>
            <input type="checkbox" id="toggle-tiktok" checked>
        </div>
        <div class="toggle-row">
            <label for="toggle-reddit">Reddit</label>
            <input type="checkbox" id="toggle-reddit" checked>
        </div>
        <div class="toggle-row">
            <label for="toggle-reels">Instagram Reels</label>
            <input type="checkbox" id="toggle-reels" checked>
        </div>
        <div class="toggle-row">
            <label for="toggle-twitter">Twitter</label>
            <input type="checkbox" id="toggle-twitter" checked>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
